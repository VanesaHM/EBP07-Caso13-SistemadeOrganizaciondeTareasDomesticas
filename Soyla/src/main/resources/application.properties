spring.application.name=soyla

logging.level.org.springframework.boot.web.embedded.tomcat=INFO

spring.datasource.url=jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5432}/${DATABASE_NAME:soyla}
spring.datasource.username=${DATABASE_USERNAME:${DATABASE_USER:postgres}}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.mail.host=sandbox.smtp.mailtrap.io
spring.mail.port=587
spring.mail.username=e465a8033f0335
spring.mail.password=5ebf9e31bf4813
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

server.port=${PORT:8080}

app.jwt.secret=${JWT_SECRET:change-me-render-jwt-secret-32-bytes-min}

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.frontend.public-url=${APP_FRONTEND_PUBLIC_URL:http://localhost:5173}
app.backend.public-url=${APP_BACKEND_PUBLIC_URL:http://localhost:8080}

spring.thymeleaf.cache=false