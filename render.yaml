databases:
  - name: soyla-db
    plan: free
    region: virginia

services:
  - type: web
    name: soyla-api
    runtime: docker
    plan: free
    region: virginia
    rootDir: Soyla
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: APP_CORS_ALLOWED_ORIGINS
        value: http://localhost:5173,http://127.0.0.1:5173,https://*.vercel.app,https://soyla.vercel.app
      - key: APP_JWT_SECRET
        generateValue: true
      - key: APP_JWT_EXPIRATION_SECONDS
        value: "3600"
      - key: APP_DATA_ENCRYPTION_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: soyla-db
          property: connectionString
      - key: DATABASE_USERNAME
        fromDatabase:
          name: soyla-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: soyla-db
          property: password
